name: Test ohsome all-users single cell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ohsome-all-users-single-cell.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install pandas pyarrow requests
      - name: Restore Notebook 05 production artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 31444549670
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb05
      - name: Test one representative cell
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, time
          import pandas as pd
          import requests

          roots = list(Path('restored_nb05').rglob('petropolis_ohsome_895_cells.parquet'))
          bounds = list(Path('restored_nb05').rglob('petropolis_grid_1km_ohsome_boundaries.geojson'))
          if not roots or not bounds:
              raise FileNotFoundError(f'Notebook 05 files missing: parquet={roots}, boundaries={bounds}')
          road = pd.read_parquet(roots[0])
          road['grid_1km_id'] = road['grid_1km_id'].astype(str)
          road['contributors_count'] = pd.to_numeric(road['contributors_count'])
          candidates = road.sort_values('contributors_count').reset_index(drop=True)
          row = candidates.iloc[len(candidates)//2]
          grid_id = str(row['grid_1km_id'])
          froms = road['contributors_count_from'].dropna().astype(str).unique().tolist()
          tos = road['contributors_count_to'].dropna().astype(str).unique().tolist()
          assert len(froms)==1 and len(tos)==1
          interval = f'{froms[0]}/{tos[0]}'

          fc = json.loads(bounds[0].read_text(encoding='utf-8'))
          feature = next(f for f in fc['features'] if str(f.get('properties',{}).get('id')) == grid_id)
          one = {'type':'FeatureCollection','features':[feature]}
          data = {
              'bpolys': json.dumps(one, ensure_ascii=False, separators=(',',':')),
              'time': interval,
              'format': 'json',
          }
          url = 'https://api.ohsome.org/v1/users/count/groupBy/boundary'
          started = time.time()
          try:
              r = requests.post(url, data=data, headers={'User-Agent':'sotm-br-2026-research/0.7'}, timeout=150)
          except requests.RequestException as exc:
              print(f'TEST_RESULT=TRANSPORT_ERROR type={type(exc).__name__} elapsed={time.time()-started:.1f}s message={exc}')
              raise SystemExit(2)
          elapsed = time.time()-started
          print(f'HTTP_STATUS={r.status_code} ELAPSED_SECONDS={elapsed:.1f} GRID_ID={grid_id} ROAD_CONTRIBUTORS={row["contributors_count"]} INTERVAL={interval}')
          if r.status_code != 200:
              print('RESPONSE_PREFIX=', r.text[:1000])
              if r.status_code in {429,500,502,503,504}:
                  raise SystemExit(3)
              raise SystemExit(4)
          body = r.json()
          groups = body.get('groupByResult')
          assert isinstance(groups,list) and len(groups)==1, body
          group = groups[0]
          assert str(group.get('groupByObject')) == grid_id, group
          result = group.get('result')
          assert isinstance(result,list) and len(result)==1, group
          item = result[0]
          assert 'value' in item and {'fromTimestamp','toTimestamp'} <= set(item), item
          print(f'TEST_RESULT=SUCCESS ALL_UNIQUE_USERS={item["value"]} FROM={item["fromTimestamp"]} TO={item["toTimestamp"]}')
          PY
