name: Run Notebook 05

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-notebook-05.yml'

jobs:
  execute-notebook-05:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas numpy pyarrow shapely requests jupyter nbconvert ipykernel

      - name: Restore Notebook 02 processed grid
        uses: actions/download-artifact@v4
        with:
          run-id: 31440862694
          artifact-ids: 9082793177
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb02

      - name: Restore processed grid path
        run: |
          mkdir -p data/processed/Petropolis
          cp restored_nb02/notebook-02-execution/data/processed/Petropolis/petropolis_grid_1km.parquet \
             data/processed/Petropolis/petropolis_grid_1km.parquet
          ls -lh data/processed/Petropolis/petropolis_grid_1km.parquet

      - name: Execute Notebook 05
        run: |
          mkdir -p executed_notebooks
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/05_query_ohsome_all_cells.ipynb \
            --output 05_query_ohsome_all_cells.executed.ipynb \
            --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=6600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Export Notebook 05 to HTML
        if: always()
        run: |
          if [ -f executed_notebooks/05_query_ohsome_all_cells.executed.ipynb ]; then
            jupyter nbconvert --to html executed_notebooks/05_query_ohsome_all_cells.executed.ipynb \
              --output 05_query_ohsome_all_cells.executed.html
          fi

      - name: Collect production outputs
        if: always()
        run: |
          mkdir -p production_outputs
          if [ -d data/raw/ohsome/Petropolis/all_895_cells ]; then
            cp -R data/raw/ohsome/Petropolis/all_895_cells production_outputs/raw_ohsome_all_895_cells
          fi
          if [ -f data/processed/Petropolis/petropolis_ohsome_1km_895_cells.parquet ]; then
            cp data/processed/Petropolis/petropolis_ohsome_1km_895_cells.parquet production_outputs/
          fi

      - name: Upload Notebook 05 production results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-05-ohsome-895-results
          path: |
            executed_notebooks/
            production_outputs/
          if-no-files-found: warn
          retention-days: 30
