name: Run Notebook 02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_notebook_02.yml'
      - 'notebooks/02_build_ibge_1km_grid.ipynb'
      - 'Petropolis/**'
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            geopandas \
            pandas \
            numpy \
            shapely \
            pyarrow \
            matplotlib \
            jupyter \
            nbconvert \
            ipykernel

      - name: Show input files
        run: |
          pwd
          find Petropolis -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Execute Notebook 02
        run: |
          mkdir -p artifacts
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/02_build_ibge_1km_grid.ipynb \
            --output 02_build_ibge_1km_grid.executed.ipynb \
            --output-dir artifacts \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Export executed notebook to HTML
        if: always()
        run: |
          if [ -f artifacts/02_build_ibge_1km_grid.executed.ipynb ]; then
            jupyter nbconvert \
              --to html \
              artifacts/02_build_ibge_1km_grid.executed.ipynb \
              --output 02_build_ibge_1km_grid.executed.html
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-02-execution
          path: |
            artifacts/
            data/processed/Petropolis/
          if-no-files-found: warn
          retention-days: 30
