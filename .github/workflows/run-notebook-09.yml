name: Run Notebook 09

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-notebook-09.yml'
      - 'notebooks/09_build_osm_cell_typology.ipynb'
      - 'scripts/notebook09_build_osm_cell_typology.py'

jobs:
  execute-notebook-09:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas numpy pyarrow shapely matplotlib scipy scikit-learn libpysal jupyter nbconvert ipykernel
      - name: Restore final Notebook 08 outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 31452397134
          artifact-ids: 9086782405
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb08
      - name: Restore corrected Notebook 07 spatial grid
        uses: actions/download-artifact@v4
        with:
          run-id: 31451193839
          artifact-ids: 9086389498
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb07
      - name: Restore processed input paths
        run: |
          mkdir -p data/processed/Petropolis
          cp restored_nb08/notebook-08-indicator-structure-results/action_outputs/processed/* data/processed/Petropolis/
          cp restored_nb07/notebook-07-maturity-indicators-results/action_outputs/processed/petropolis_grid_1km_with_maturity_indicators.parquet data/processed/Petropolis/
          ls -lh data/processed/Petropolis/
      - name: Execute Notebook 09
        run: |
          mkdir -p executed_notebooks
          jupyter nbconvert --to notebook --execute notebooks/09_build_osm_cell_typology.ipynb \
            --output 09_build_osm_cell_typology.executed.ipynb --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.kernel_name=python3
      - name: Export executed Notebook 09 to HTML
        if: always()
        run: |
          if [ -f executed_notebooks/09_build_osm_cell_typology.executed.ipynb ]; then
            jupyter nbconvert --to html executed_notebooks/09_build_osm_cell_typology.executed.ipynb --output 09_build_osm_cell_typology.executed.html
          fi
      - name: Collect Notebook 09 outputs
        if: always()
        run: |
          mkdir -p action_outputs/processed
          for f in \
            data/processed/Petropolis/petropolis_osm_cell_typology_895_cells.parquet \
            data/processed/Petropolis/petropolis_grid_1km_with_osm_typology.parquet \
            data/processed/Petropolis/petropolis_osm_typology_feature_selection.csv \
            data/processed/Petropolis/petropolis_osm_typology_preprocessing.csv \
            data/processed/Petropolis/petropolis_osm_typology_model_selection.csv \
            data/processed/Petropolis/petropolis_osm_typology_stability.csv \
            data/processed/Petropolis/petropolis_osm_typology_profiles.csv \
            data/processed/Petropolis/petropolis_osm_typology_selected_model.csv \
            data/processed/Petropolis/petropolis_osm_typology_quality_checks.csv \
            data/processed/Petropolis/petropolis_osm_cell_typology_map.png; do
            if [ -f "$f" ]; then cp "$f" action_outputs/processed/; fi
          done
      - name: Upload Notebook 09 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-09-osm-cell-typology-results
          path: |
            executed_notebooks/
            action_outputs/
          if-no-files-found: warn
          retention-days: 30
