name: Test all OSM user count

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-all-osm-user-count.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests
      - name: Test substantive contribution types on one cell
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import pandas as pd
          import requests

          nb05 = Path('data/output/notebooks/05/notebook-05-ohsome-production-results/production_outputs')
          road = pd.read_parquet(nb05/'petropolis_ohsome_895_cells.parquet')
          fc = json.loads((nb05/'petropolis_grid_1km_ohsome_boundaries.geojson').read_text())
          by_id = {str(f['properties']['id']): f for f in fc['features']}
          road['grid_1km_id'] = road['grid_1km_id'].astype(str)
          road['contributors_count'] = pd.to_numeric(road['contributors_count'])
          road = road.sort_values('contributors_count').reset_index(drop=True)
          row = road.iloc[len(road)//2]
          gid = row['grid_1km_id']
          fr = str(road['contributors_count_from'].dropna().iloc[0])
          to = str(road['contributors_count_to'].dropna().iloc[0])
          one = {'type':'FeatureCollection','features':[by_id[gid]]}
          data = {
              'bpolys': json.dumps(one,separators=(',',':')),
              'time': f'{fr}/{to}',
              'format':'json',
              'contributionType':'creation,deletion,tagChange,geometryChange',
          }
          url = 'https://api.ohsome.org/v1/users/count/groupBy/boundary'
          s = requests.Session()
          s.headers['User-Agent'] = 'sotm-br-2026-research/0.5 (diagnostic)'
          t0=time.time()
          try:
              r=s.post(url,data=data,timeout=180)
              print('cell=',gid,'road_users=',row['contributors_count'],'status=',r.status_code,'seconds=',round(time.time()-t0,2))
              print(json.dumps(r.json(),ensure_ascii=False)[:2000])
          except Exception as e:
              print('cell=',gid,'road_users=',row['contributors_count'],'ERROR',type(e).__name__,str(e),'seconds=',round(time.time()-t0,2))
          PY
