name: Apply Notebook 12 road contributor independent patch

on:
  push:
    paths:
      - 'scripts/apply_nb12_road_contributor_independent_patch.py'
      - '.github/workflows/apply-nb12-road-contributor-independent-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_nb12_road_contributor_independent_patch.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/notebook12_build_article_maps.py
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Generate road contributor map independently'
            git push origin HEAD:main
          fi
