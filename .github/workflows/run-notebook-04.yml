name: Run Notebook 04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-notebook-04.yml'

jobs:
  execute-notebook-04:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas numpy pyarrow shapely requests jupyter nbconvert ipykernel

      - name: Verify Notebook 03 outputs
        run: |
          test -f data/intermediate/ohsome/Petropolis/petropolis_grid_1km_ohsome_test_boundaries.geojson
          test -f data/intermediate/ohsome/Petropolis/petropolis_grid_1km_ohsome_test_cells.parquet

      - name: Execute Notebook 04
        run: |
          mkdir -p executed_notebooks
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/04_query_ohsome_test_cells.ipynb \
            --output 04_query_ohsome_test_cells.executed.ipynb \
            --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Export executed notebook to HTML
        if: always()
        run: |
          if [ -f executed_notebooks/04_query_ohsome_test_cells.executed.ipynb ]; then
            jupyter nbconvert \
              --to html \
              executed_notebooks/04_query_ohsome_test_cells.executed.ipynb \
              --output 04_query_ohsome_test_cells.executed.html
          fi

      - name: Collect ohsome outputs
        if: always()
        run: |
          mkdir -p action_outputs
          if [ -d data/raw/ohsome/Petropolis/test_10_cells ]; then
            cp -R data/raw/ohsome/Petropolis/test_10_cells action_outputs/raw_ohsome_test_10_cells
          fi
          if [ -f data/processed/Petropolis/petropolis_ohsome_test_10_cells.parquet ]; then
            cp data/processed/Petropolis/petropolis_ohsome_test_10_cells.parquet action_outputs/
          fi

      - name: Upload Notebook 04 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-04-ohsome-test-results
          path: |
            executed_notebooks/
            action_outputs/
          if-no-files-found: warn
          retention-days: 30
