name: Run Notebook 04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-notebook-04.yml'
      - 'notebooks/04_query_ohsome_test_cells.ipynb'

jobs:
  execute-notebook-04:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas numpy pyarrow shapely requests jupyter nbconvert ipykernel

      - name: Restore Notebook 02 processed grid
        uses: actions/download-artifact@v4
        with:
          run-id: 31440862694
          artifact-ids: 9082793177
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb02

      - name: Restore processed grid path
        run: |
          mkdir -p data/processed/Petropolis
          cp restored_nb02/notebook-02-execution/data/processed/Petropolis/petropolis_grid_1km.parquet \
             data/processed/Petropolis/petropolis_grid_1km.parquet
          ls -lh data/processed/Petropolis/petropolis_grid_1km.parquet

      - name: Execute Notebook 03 to prepare test boundaries
        run: |
          mkdir -p executed_notebooks
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/03_prepare_ohsome_boundaries.ipynb \
            --output 03_prepare_ohsome_boundaries.executed.ipynb \
            --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Verify Notebook 03 outputs
        run: |
          test -f data/intermediate/ohsome/Petropolis/petropolis_grid_1km_ohsome_test_boundaries.geojson
          test -f data/intermediate/ohsome/Petropolis/petropolis_grid_1km_ohsome_test_cells.parquet
          ls -lh data/intermediate/ohsome/Petropolis/

      - name: Execute Notebook 04
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/04_query_ohsome_test_cells.ipynb \
            --output 04_query_ohsome_test_cells.executed.ipynb \
            --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Export executed Notebook 04 to HTML
        if: always()
        run: |
          if [ -f executed_notebooks/04_query_ohsome_test_cells.executed.ipynb ]; then
            jupyter nbconvert \
              --to html \
              executed_notebooks/04_query_ohsome_test_cells.executed.ipynb \
              --output 04_query_ohsome_test_cells.executed.html
          fi

      - name: Collect ohsome outputs
        if: always()
        run: |
          mkdir -p action_outputs
          if [ -d data/raw/ohsome/Petropolis/test_10_cells ]; then
            cp -R data/raw/ohsome/Petropolis/test_10_cells action_outputs/raw_ohsome_test_10_cells
          fi
          if [ -f data/processed/Petropolis/petropolis_ohsome_test_10_cells.parquet ]; then
            cp data/processed/Petropolis/petropolis_ohsome_test_10_cells.parquet action_outputs/
          fi
          if [ -d data/intermediate/ohsome/Petropolis ]; then
            cp -R data/intermediate/ohsome/Petropolis action_outputs/ohsome_boundaries
          fi

      - name: Upload Notebook 04 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-04-ohsome-test-results
          path: |
            executed_notebooks/
            action_outputs/
          if-no-files-found: warn
          retention-days: 30
