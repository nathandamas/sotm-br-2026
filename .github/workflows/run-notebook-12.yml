name: Run Notebook 12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notebooks/12_build_article_maps.ipynb'
      - 'scripts/notebook12_build_article_maps.py'
      - '.github/workflows/run-notebook-12.yml'

permissions:
  contents: write
  actions: read

jobs:
  execute-notebook-12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pandas numpy pyarrow shapely matplotlib contextily xyzservices pyproj rasterio jupyter nbconvert ipykernel

      - name: Restore Notebook 11 final outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 31486390648
          artifact-ids: 9099287431
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nathandamas/sotm-br-2026
          path: restored_nb11

      - name: Restore final GeoParquet
        run: |
          mkdir -p data/processed/Petropolis
          cp restored_nb11/notebook-11-final-osm-typology-results/action_outputs/processed/petropolis_grid_1km_with_osm_typology_final.parquet data/processed/Petropolis/

      - name: Execute Notebook 12
        run: |
          mkdir -p executed_notebooks
          jupyter nbconvert --to notebook --execute notebooks/12_build_article_maps.ipynb \
            --output 12_build_article_maps.executed.ipynb \
            --output-dir executed_notebooks \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Export executed notebook to HTML
        run: jupyter nbconvert --to html executed_notebooks/12_build_article_maps.executed.ipynb --output 12_build_article_maps.executed.html

      - name: Commit article figures to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/article/
          if git diff --cached --quiet; then
            echo 'No figure changes to commit.'
          else
            git commit -m 'Generate article choropleth maps'
            git push origin main
          fi

      - name: Upload map results
        uses: actions/upload-artifact@v4
        with:
          name: notebook-12-article-maps
          path: |
            executed_notebooks/
            figures/article/
          retention-days: 30
