name: Reorganize article outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorganize-article-outputs.yml'

jobs:
  reorganize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update script and notebook output-path references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'figures/article': 'data/output/figures',
              'tables/article': 'data/output/tables',
          }
          candidates = [
              Path('scripts/notebook12_build_article_maps.py'),
              Path('scripts/notebook13_build_article_tables.py'),
              Path('notebooks/12_build_article_maps.ipynb'),
              Path('notebooks/13_build_article_tables.ipynb'),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('Updated', path)
          PY

      - name: Validate new structure
        run: |
          set -euo pipefail
          test -d data/output/figures
          test -d data/output/tables
          test "$(find data/output/figures -maxdepth 1 -type f | wc -l)" -ge 17
          test "$(find data/output/tables -maxdepth 1 -type f | wc -l)" -ge 17
          ! test -d figures
          ! test -d tables
          ! grep -R "figures/article\|tables/article" scripts/notebook12_build_article_maps.py scripts/notebook13_build_article_tables.py notebooks/12_build_article_maps.ipynb notebooks/13_build_article_tables.ipynb

      - name: Commit updated references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/notebook12_build_article_maps.py scripts/notebook13_build_article_tables.py notebooks/12_build_article_maps.ipynb notebooks/13_build_article_tables.ipynb
          if git diff --cached --quiet; then
            echo 'No reference changes to commit.'
          else
            git commit -m 'Update article output paths'
            git push origin main
          fi
