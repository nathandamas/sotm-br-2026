name: Apply Notebook 12 contributor maps patch

on:
  push:
    paths:
      - 'scripts/apply_nb12_contributor_maps_patch.py'
      - '.github/workflows/apply-nb12-contributor-maps-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply_nb12_contributor_maps_patch.py

      - name: Commit patched map script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/notebook12_build_article_maps.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Add unique contributor article maps"
            git push origin HEAD:main
          fi
