name: Probe ohsome all contributors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ohsome-all-contributors.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install pandas pyarrow requests
      - name: Probe one representative 1 km cell
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          import pandas as pd
          import requests

          base = Path('data/output/notebooks/05/notebook-05-ohsome-production-results/production_outputs')
          road = pd.read_parquet(base / 'petropolis_ohsome_895_cells.parquet')
          fc = json.loads((base / 'petropolis_grid_1km_ohsome_boundaries.geojson').read_text(encoding='utf-8'))
          road['grid_1km_id'] = road['grid_1km_id'].astype(str)
          med = float(road['contributors_count'].median())
          row = road.iloc[(road['contributors_count'] - med).abs().argsort().iloc[0]]
          gid = str(row['grid_1km_id'])
          feature = next(f for f in fc['features'] if str(f.get('properties',{}).get('id')) == gid)
          frm = str(row['contributors_count_from'])
          to = str(row['contributors_count_to'])
          payload = {
              'bpolys': json.dumps({'type':'FeatureCollection','features':[feature]}, separators=(',',':')),
              'time': f'{frm}/{to}',
              'format': 'json',
          }
          url = 'https://api.ohsome.org/v1/users/count/groupBy/boundary'
          print('grid_1km_id=', gid)
          print('road_contributors=', row['contributors_count'])
          print('time=', payload['time'])
          t0 = time.time()
          try:
              r = requests.post(url, data=payload, timeout=(20, 180), headers={'User-Agent':'sotm-br-2026-research/0.6'})
              elapsed = time.time() - t0
              print('status=', r.status_code)
              print('elapsed_seconds=', round(elapsed, 3))
              print('content_type=', r.headers.get('content-type',''))
              print('body=', r.text[:4000])
              if r.status_code != 200:
                  raise SystemExit(2)
              body = r.json()
              groups = body.get('groupByResult')
              assert isinstance(groups, list) and len(groups) == 1, body
              assert str(groups[0].get('groupByObject')) == gid, body
              result = groups[0].get('result')
              assert isinstance(result, list) and len(result) == 1, body
              item = result[0]
              assert 'value' in item and 'fromTimestamp' in item and 'toTimestamp' in item, body
              assert float(item['value']) >= float(row['contributors_count'])
              print('PROBE_VALID=1')
              print('all_unique_contributors=', item['value'])
          except requests.RequestException as exc:
              print('PROBE_TRANSIENT_ERROR=', repr(exc))
              raise SystemExit(3)
          PY
